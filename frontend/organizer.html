<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EventPass | Organizer Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ── Responsive override: allow wider layout on laptop ── */
        @media (min-width: 900px) {
            body {
                max-width: 100% !important;
                box-shadow: none !important;
            }
            .org-layout {
                display: grid;
                grid-template-columns: 420px 1fr;
                gap: 0;
                min-height: 100dvh;
            }
            .sidebar {
                border-right: 1px solid rgba(255,255,255,0.06);
                height: 100dvh;
                overflow-y: auto;
                position: sticky;
                top: 0;
            }
            .events-panel {
                padding: 40px;
                overflow-y: auto;
                height: 100dvh;
            }
        }

        @media (max-width: 899px) {
            .org-layout { display: block; }
            .sidebar { padding-bottom: 0; }
            .events-panel { padding: 20px 16px 40px; }
        }

        /* ── Form inputs ── */
        .ep-input {
            width: 100%;
            padding: 13px 16px;
            background: #f8fafc;
            border: 1.5px solid #e8edf5;
            border-radius: 14px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #0f172a;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .ep-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
        }
        .ep-input::placeholder { color: #94a3b8; }
        textarea.ep-input { resize: none; height: 90px; }

        /* ── Scrollbar in events panel ── */
        .events-panel::-webkit-scrollbar { width: 4px; }
        .events-panel::-webkit-scrollbar-track { background: transparent; }
        .events-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* ── Stat cards ── */
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 18px 20px;
            flex: 1;
        }

        /* ── Post button ── */
        .post-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-weight: 700;
            font-size: 15px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.01em;
        }
        .post-btn:hover { filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(37,99,235,0.35); }
        .post-btn:active { transform: scale(0.98); }
        .post-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ── Logout btn ── */
        .logout-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 7px;
        }
        .logout-btn:hover { background: rgba(239,68,68,0.12); color: #f87171; border-color: rgba(239,68,68,0.2); }

        /* ── Label ── */
        .ep-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 6px;
        }
    </style>
</head>
<body style="background:#0B1E3F; font-family:'Poppins',sans-serif;">

<div class="org-layout">

    <aside class="sidebar" style="background:#0B1E3F; padding: 32px 28px 40px;">

        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:32px;">
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="width:42px;height:42px;background:linear-gradient(135deg,#2563eb,#1e40af);border-radius:12px;display:flex;align-items:center;justify-content:center;">
                    <span style="color:white;font-weight:800;font-size:14px;">EP</span>
                </div>
                <div>
                    <div style="color:white;font-weight:700;font-size:16px;">Organizer Hub</div>
                    <div style="color:#64748b;font-size:11px;" id="organizer-name">Loading...</div>
                </div>
            </div>
            <button class="logout-btn" onclick="localStorage.clear(); window.location.href='login.html'">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:28px;">
            <div class="stat-card">
                <div style="color:#64748b;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;">Total Events</div>
                <div style="color:white;font-size:28px;font-weight:800;margin-top:4px;" id="eventCount">—</div>
            </div>
            <div class="stat-card">
                <div style="color:#64748b;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;">Status</div>
                <div style="color:#34d399;font-size:13px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:6px;">
                    <span style="width:7px;height:7px;background:#34d399;border-radius:50%;display:inline-block;box-shadow:0 0 6px #34d399;"></span>
                    Active
                </div>
            </div>
        </div>

        <div style="background:white;border-radius:24px;padding:26px;">
            <div style="margin-bottom:20px;">
                <div style="font-size:16px;font-weight:700;color:#0f172a;">Create New Event</div>
                <div style="font-size:12px;color:#94a3b8;margin-top:2px;">Fill in the details below</div>
            </div>

            <form id="createEventForm">
                <div style="margin-bottom:14px;">
                    <label class="ep-label">Event Name</label>
                    <input type="text" id="eventName" class="ep-input" placeholder="e.g. Git Workshop 2026" required>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
                    <div>
                        <label class="ep-label">Date</label>
                        <input type="date" id="eventDate" class="ep-input" required>
                    </div>
                    <div>
                        <label class="ep-label">Capacity</label>
                        <input type="number" id="eventCapacity" class="ep-input" placeholder="100" min="10" max="10000">
                    </div>
                </div>

                <div style="margin-bottom:14px;">
                    <label class="ep-label">Location</label>
                    <input type="text" id="eventLocation" class="ep-input" placeholder="e.g. Dubai, SHJ Hall B" required>
                </div>

                <div style="margin-bottom:20px;">
                    <label class="ep-label">Description</label>
                    <textarea id="eventDesc" class="ep-input" placeholder="What's this event about?"></textarea>
                </div>

                <button type="submit" class="post-btn">
                    <i class="fas fa-rocket" style="margin-right:8px;"></i> Post Event
                </button>
            </form>
        </div>
    </aside>

    <section class="events-panel" style="background:#07152e;">

        <div style="margin-bottom:28px;">
            <h2 style="color:white;font-size:22px;font-weight:800;margin:0;">My Events</h2>
            <p style="color:#475569;font-size:13px;margin-top:4px;">Click any event to manage attendees</p>
        </div>

        <div id="myEventsList" class="space-y-3">
            <div style="text-align:center;padding:60px 0;color:#475569;font-size:14px;">
                <i class="fas fa-circle-notch fa-spin" style="font-size:24px;color:#2563eb;display:block;margin-bottom:12px;"></i>
                Loading your events...
            </div>
        </div>

    </section>

</div>

<script src="js/toast.js"></script>
<script src="js/organizer.js"></script>
</body>
</html>
