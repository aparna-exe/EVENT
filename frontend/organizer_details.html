<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EventPass | Event Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background:#0B1E3F; font-family:'Poppins',sans-serif;" class="text-slate-100 min-h-screen p-4 max-w-md mx-auto">

    <div class="flex items-center justify-between my-6">
        <button onclick="window.location.href='organizer.html'" class="text-slate-400 hover:text-white bg-slate-800/50 px-3 py-2 rounded-xl text-sm transition-all">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </button>
        <h1 class="text-lg font-bold tracking-tight">Event Management</h1>
        <div class="w-10"></div> 
    </div>

    <div class="bg-gradient-to-br from-[#122A57] to-[#0d1f42] rounded-3xl p-6 border border-slate-700/30 shadow-xl mb-5">
        <span class="text-blue-400 text-xs font-bold uppercase tracking-widest block mb-2">Live Statistics</span>
        <h2 id="metaTitle" class="text-xl font-extrabold text-white tracking-tight leading-tight">Loading Event...</h2>
        
        <div class="space-y-2 mt-4 text-sm text-slate-300">
            <div><i class="far fa-calendar text-blue-500 mr-2 w-4"></i><span id="metaDate">—</span></div>
            <div><i class="fas fa-map-marker-alt text-rose-400 mr-2 w-4"></i><span id="metaLocation">—</span></div>
        </div>

        <div class="mt-6 pt-5 border-t border-slate-700/30">
            <div class="flex justify-between items-end mb-2">
                <span class="text-xs text-slate-400">Total Enrollment Capacity</span>
                <div class="font-bold text-sm">
                    <span id="registeredCount" class="text-emerald-400 text-lg">0</span> 
                    <span id="capacityMax" class="text-slate-500 text-xs font-normal">/ 100 max</span>
                </div>
            </div>
            <div class="w-full bg-slate-950 rounded-full h-2.5 overflow-hidden">
                <div id="capacityProgressBar" class="bg-gradient-to-r from-blue-500 to-emerald-400 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-6">
        <button onclick="window.exportAttendanceList()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs py-4 rounded-2xl transition-all border border-slate-700/50 flex items-center justify-center gap-1.5">
            <i class="fas fa-file-excel text-sm text-emerald-400"></i> Export List
        </button>
        
        <button onclick="window.toggleScanner()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-4 rounded-2xl transition-all shadow-lg shadow-blue-900/30 flex items-center justify-center gap-1.5">
            <i class="fas fa-camera text-sm"></i> Scan QR Code
        </button>
    </div>

    <div id="scannerContainer" class="hidden mb-6 overflow-hidden rounded-3xl border border-slate-700/40 bg-slate-950 p-4">
        <div id="reader" class="w-full rounded-2xl overflow-hidden"></div>
        <button onclick="window.toggleScanner()" class="w-full mt-3 bg-rose-500/20 text-rose-400 text-xs font-bold py-2.5 rounded-xl border border-rose-500/30">
            Cancel Scanning
        </button>
    </div>

    <div class="flex justify-between items-center mb-3 px-1">
        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Registered Roster Log</h3>
    </div>

    <div id="rosterContainer" class="space-y-3 pb-10">
        <div class="text-center py-10">
            <i class="fas fa-circle-notch fa-spin text-blue-500 text-xl mb-2"></i>
            <p class="text-slate-500 text-xs">Querying system database records...</p>
        </div>
    </div>

    <script src="js/organizer_details.js"></script>
</body>
</html>
