<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EventPass | Organizer Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0B1E3F; }
    </style>
</head>
<body class="min-h-screen text-slate-100 pb-12">

    <header class="bg-[#11254C] border-b border-slate-700/40 sticky top-0 z-40 px-6 py-5 flex items-center justify-between">
        <button onclick="window.location.href='organizer.html'" class="text-slate-400 hover:text-white flex items-center gap-2 transition-all">
            <i class="fas fa-arrow-left"></i> <span class="text-sm font-medium">Dashboard</span>
        </button>
        <span class="text-xs font-bold uppercase tracking-widest text-blue-400">Event Management</span>
        <div class="w-8 h-8 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center">
            <i class="fas fa-sliders-h text-sm"></i>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-8">
        
        <div class="bg-gradient-to-br from-[#122A57] to-[#0D2147] rounded-[2rem] p-6 shadow-xl border border-slate-700/30">
            <h1 id="metaTitle" class="text-2xl font-bold text-white leading-tight">Loading Event...</h1>
            
            <div class="grid grid-cols-2 gap-4 mt-6 pt-6 border-t border-slate-700/40">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center"><i class="far fa-calendar"></i></div>
                    <div><p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Date</p><p id="metaDate" class="text-sm font-semibold text-slate-200">Loading...</p></div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-red-500/10 text-red-400 rounded-xl flex items-center justify-center"><i class="fas fa-map-marker-alt"></i></div>
                    <div><p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Venue</p><p id="metaLocation" class="text-sm font-semibold text-slate-200 truncate">Loading...</p></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-[#122A57]/60 rounded-2xl p-5 border border-slate-700/20">
                <p class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Registrations</p>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="registeredCount" class="text-3xl font-bold text-white">0</span>
                    <span id="capacityMax" class="text-xs text-slate-400 font-medium">/ 100 max</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-1.5 mt-4 overflow-hidden">
                    <div id="capacityProgressBar" class="bg-blue-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-[#122A57]/60 rounded-2xl p-5 border border-slate-700/20 flex flex-col justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Roster Management</p>
                    <p class="text-[11px] text-slate-400 mt-1">Review live credential lists for verified attendees.</p>
                </div>
                <button onclick="alert('Exporting system CSV... Complete!')" class="mt-4 w-full bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 py-2.5 rounded-xl font-bold border border-slate-700/40 transition-all">
                    <i class="fas fa-download mr-1"></i> Export Attendance List
                </button>
            </div>
        </div>

        <div>
            <h3 class="text-white font-semibold text-lg mb-4 flex items-center gap-2">
                <i class="fas fa-users text-sm text-blue-400"></i> Active Attendee Roster
            </h3>
            
            <div id="rosterContainer" class="space-y-3">
                <div class="text-center py-10 bg-[#122A57]/20 rounded-2xl border border-dashed border-slate-800">
                    <i class="fas fa-circle-notch fa-spin text-blue-500 mb-2"></i>
                    <p class="text-slate-500 text-sm">Querying active registration rosters...</p>
                </div>
            </div>
        </div>

    </main>

    <script src="js/organizer_details.js"></script>
    <script src="js/toast.js"></script>
</body>
</html>
