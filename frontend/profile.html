<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EventPass | My QR Pass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0B1E3F; /* Midnight Blue */
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .ticket-card {
            background: white;
            width: 100%;
            max-width: 350px;
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        /* Subtle glow around the QR container */
        .qr-container {
            background: white;
            padding: 15px;
            border-radius: 24px;
            display: inline-block;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
            border: 1px solid #f1f5f9;
            margin: 24px 0;
        }
        .qr-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }
        /* Navigation dots for that "Ticket" look */
        .ticket-card::before, .ticket-card::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: #0B1E3F;
            border-radius: 50%;
            top: 70%;
        }
        .ticket-card::before { left: -15px; }
        .ticket-card::after { right: -15px; }
    </style>
</head>
<body>

    <!-- Back Button -->
    <a href="dashboard.html" class="absolute top-8 left-6 text-slate-400 hover:text-white flex items-center gap-2 transition-colors">
        <i class="fas fa-chevron-left"></i>
        <span class="text-sm font-medium">Back to Events</span>
    </a>

    <div class="ticket-card">
        <div class="mb-2">
            <h1 class="text-2xl font-bold text-[#0B1E3F]">My QR Pass</h1>
            <p class="text-slate-400 text-xs font-medium uppercase tracking-widest mt-1">Permanent Identity</p>
        </div>

        <!-- QR Code Section -->
        <div class="qr-container">
            <img id="userQr" src="assets/placeholder-qr.png" alt="Scan QR" class="qr-image">
        </div>

        <!-- User Info -->
        <div class="mt-4">
            <p class="text-slate-400 text-[10px] uppercase font-bold tracking-tighter">Member ID</p>
            <p id="userIdDisplay" class="text-[#0B1E3F] font-mono font-bold text-lg">#EP-0000</p>
        </div>

        <div class="mt-10 pt-6 border-t border-dashed border-slate-200">
            <p class="text-slate-500 text-xs leading-relaxed">
                <i class="fas fa-info-circle mr-1 text-blue-500"></i>
                Show this QR code at the event entrance for instant check-in.
            </p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Retrieve User ID from localStorage (set during login/signup)
            const userId = localStorage.getItem('user_id') || '0000';
            
            // Set the ID display
            document.getElementById('userIdDisplay').innerText = `#EP-${userId.padStart(4, '0')}`;
            
            // Set the QR image source
            // Logic: Fetches the permanent QR generated during signup
            const qrImg = document.getElementById('userQr');
            qrImg.src = `/qr_module/qr_images/user_${userId}.png`;
            
            // Error handling for missing QR images
            qrImg.onerror = () => {
                qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + userId;
            };
        });
    </script>
    <script src="js/toast.js"></script>
</body>
</html>
